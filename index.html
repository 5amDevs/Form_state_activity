<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get in touch</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <form
    class="contact-form"
    onsubmit="event.preventDefault(); alert('Form submitted!');"
  >
    <h1>Get in touch</h1>
    <p class="subtitle">Fill out the form below and we'll get back to you.</p>

    <div class="row">
      <div class="field">
        <label for="fname">First name</label>
        <input id="fname" name="firstName" type="text" placeholder="Jane" required>
      </div>

      <div class="field">
        <label for="lname">Last name</label>
        <input id="lname" name="lastName" type="text" placeholder="Doe" required>
      </div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" placeholder="jane@example.com" required>
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" placeholder="+1 555 000 0000">
    </div>

    <div class="field">
      <label for="company">Company</label>
      <input id="company" name="company" type="text" placeholder="Acme Inc.">
    </div>

    <div class="field">
      <label for="website">Website</label>
      <input id="website" name="website" type="url" placeholder="https://example.com">
    </div>

    <div class="row">
      <div class="field">
        <label for="dob">Date of birth</label>
        <input id="dob" name="dateOfBirth" type="date">
      </div>

      <div class="field">
        <label for="budget">Budget</label>
        <input id="budget" name="budget" type="number" min="0" placeholder="1000">
      </div>
    </div>

    <div class="field">
      <label for="country">Country</label>
      <select id="country" name="country">
        <option value="">Select a country</option>
        <option>Philippines</option>
        <option>United States</option>
        <option>United Kingdom</option>
        <option>Other</option>
      </select>
    </div>

    <div class="field">
      <label for="topic">Topic</label>
      <select id="topic" name="topic">
        <option value="">Choose a topic</option>
        <option>General inquiry</option>
        <option>Support</option>
        <option>Partnership</option>
      </select>
    </div>

    <div class="field">
      <label for="message">Message</label>
      <textarea id="message" name="message" placeholder="Tell us more..."></textarea>
    </div>

    <div class="checkbox-row">
      <input id="agree" name="agree" type="checkbox" required>
      <label for="agree">I agree to the terms and conditions</label>
    </div>

    <button type="submit">Submit</button>
  </form>
</body>
</html>
